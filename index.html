<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <title>پنل کاربری</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="dns-prefetch" href="https://cdn.jsdelivr.net">
  <link rel="preload" as="font" type="font/woff2" crossorigin href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/fonts/webfonts/Vazirmatn-Regular.woff2">
  <link rel="preload" as="font" type="font/woff2" crossorigin href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/fonts/webfonts/Vazirmatn-Bold.woff2">
  <style>
    @font-face {
      font-family: Vazirmatn;
      src: url("https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/fonts/webfonts/Vazirmatn-Regular.woff2") format("woff2");
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: Vazirmatn;
      src: url("https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/fonts/webfonts/Vazirmatn-Medium.woff2") format("woff2");
      font-weight: 500;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: Vazirmatn;
      src: url("https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/fonts/webfonts/Vazirmatn-SemiBold.woff2") format("woff2");
      font-weight: 600;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: Vazirmatn;
      src: url("https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/fonts/webfonts/Vazirmatn-Bold.woff2") format("woff2");
      font-weight: 700;
      font-style: normal;
      font-display: swap;
    }

    :root {
      --bg: #0e0c0a;
      --bg-2: #10151c;
      --surface: #141920;
      --surface-2: #1a202a;
      --text: #e8eef4;
      --muted: #8a96a8;
      --accent: #6ba3c7;
      --accent-soft: rgba(107, 163, 199, 0.22);
      --accent-dim: rgba(107, 163, 199, 0.10);
      --line: rgba(107, 163, 199, 0.16);
      --ok: #5dab7a;
      --warn: #c9a040;
      --bad: #c07068;
      --alert: #e8a09a;
      --max: 460px;
      --r: 10px;
      --r-sm: 8px;
      --h-ico: 40px;
      --h-ctl: 48px;
      --os-gap: 8px;
      --os-pad: 12px;
      --ease: cubic-bezier(0.22, 1, 0.36, 1);
      --dur: 0.42s;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
      }
    }

    html {
      scrollbar-width: thin;
      scrollbar-color: rgba(107, 163, 199, 0.45) transparent;
    }

    html::-webkit-scrollbar,
    body::-webkit-scrollbar,
    .modal-body::-webkit-scrollbar {
      width: 5px;
      height: 5px;
    }

    html::-webkit-scrollbar-track,
    body::-webkit-scrollbar-track,
    .modal-body::-webkit-scrollbar-track {
      background: transparent;
    }

    html::-webkit-scrollbar-thumb,
    body::-webkit-scrollbar-thumb,
    .modal-body::-webkit-scrollbar-thumb {
      background: rgba(107, 163, 199, 0.38);
      border-radius: 99px;
    }

    html::-webkit-scrollbar-thumb:hover,
    body::-webkit-scrollbar-thumb:hover,
    .modal-body::-webkit-scrollbar-thumb:hover {
      background: rgba(107, 163, 199, 0.62);
    }

    body {
      min-height: 100dvh;
      font-family: Vazirmatn, "Segoe UI", Tahoma, sans-serif;
      font-size: 15px;
      line-height: 1.6;
      color: var(--text);
      background: var(--bg);
      padding: max(24px, env(safe-area-inset-top)) 20px max(32px, env(safe-area-inset-bottom));
      -webkit-font-smoothing: antialiased;
      overflow-x: clip;
      scrollbar-width: thin;
      scrollbar-color: rgba(107, 163, 199, 0.45) transparent;
    }

    body::after {
      content: "";
      position: fixed;
      inset: 0;
      z-index: -1;
      pointer-events: none;
      background:
        radial-gradient(ellipse 90% 50% at 50% -10%, rgba(61, 90, 128, 0.22), transparent 55%),
        radial-gradient(ellipse 60% 40% at 100% 100%, rgba(45, 70, 100, 0.14), transparent 50%),
        linear-gradient(180deg, #121820 0%, var(--bg) 40%, #0a0c10 100%);
    }

    .wrap {
      width: 100%;
      max-width: var(--max);
      min-width: 0;
      margin: 0 auto;
      animation: rise 0.55s var(--ease) both;
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .crown {
      display: flex;
      justify-content: center;
      gap: 6px;
      margin-bottom: 18px;
      opacity: 0.4;
    }

    .crown span {
      width: 3px;
      height: 14px;
      border-radius: 2px;
      background: linear-gradient(180deg, var(--accent), transparent);
    }

    .crown span:nth-child(2), .crown span:nth-child(4) { height: 20px; }
    .crown span:nth-child(3) { height: 26px; }

    .head {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-bottom: 20px;
      margin-bottom: 18px;
      border-bottom: 1px solid var(--line);
      text-align: center;
    }

    .user,
    .stat-v,
    .stat-v-sm,
    .os-name,
    .os-tag,
    .cfg-name,
    .app-name {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .user {
      font-size: 1.85rem;
      font-weight: 700;
      width: 100%;
      line-height: 1;
      margin: 0 0 16px;
      text-box-trim: trim-both;
      text-box-edge: cap alphabetic;
    }

    .sub-status {
      display: block;
      width: 100%;
      margin: 0 0 16px;
      font-size: 0.86rem;
      font-weight: 500;
      line-height: 1.5;
      color: var(--muted);
      text-align: center;
    }

    .sub-status-v {
      margin: 0 2px;
      font-weight: 700;
      font-style: normal;
      transition: color 0.25s var(--ease);
    }

    .sub-status.ok .sub-status-v { color: var(--ok); }
    .sub-status.warn .sub-status-v { color: var(--warn); }
    .sub-status.bad .sub-status-v { color: var(--alert); }

    .head-chips {
      display: flex;
      flex-wrap: nowrap;
      align-items: stretch;
      justify-content: center;
      gap: 8px;
      width: 100%;
      max-width: 250px;
      margin-inline: auto;
    }

    .chip,
    .support-btn {
      display: inline-grid;
      grid-auto-flow: column;
      align-items: center;
      justify-content: center;
      column-gap: 8px;
      box-sizing: border-box;
      flex: 1 1 0;
      min-width: 0;
      max-width: 118px;
      height: var(--h-ico);
      padding: 0 14px;
      border-radius: 999px;
      font: inherit;
      font-size: 0.8rem;
      font-weight: 700;
      line-height: 1;
      text-decoration: none;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      transition: background 0.2s var(--ease), border-color 0.2s;
    }

    .chip-label {
      display: block;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      line-height: 1;
    }

    .chip-cap {
      color: var(--accent);
      border: 1.5px solid rgba(107, 163, 199, 0.45);
      background: rgba(107, 163, 199, 0.08);
    }

    .chip-cap svg,
    .support-btn svg {
      width: 16px;
      height: 16px;
      flex-shrink: 0;
      display: block;
      margin: 0;
    }

    .support-btn {
      display: none;
      border: 1.5px solid rgba(232, 160, 154, 0.55);
      background: rgba(232, 160, 154, 0.07);
      color: var(--alert);
    }

    .btn svg,
    .modal-title svg,
    .stat-title svg,
    .apps-title svg {
      width: 18px;
      height: 18px;
      flex-shrink: 0;
      display: block;
    }

    .stat-title svg,
    .apps-title svg {
      width: 17px;
      height: 17px;
      opacity: 0.95;
    }

    .support-btn.on { display: inline-grid; }
    .support-btn:hover {
      background: rgba(232, 160, 154, 0.14);
      border-color: rgba(232, 160, 154, 0.8);
      color: var(--alert);
    }
    .support-btn:active { opacity: 0.88; }

    .renew-alert {
      display: none;
      align-items: center;
      justify-content: center;
      gap: 10px;
      font-size: 0.82rem;
      font-weight: 700;
      color: var(--alert);
      padding: 13px 16px;
      margin-bottom: 14px;
      border: 1.5px solid rgba(192, 112, 104, 0.7);
      border-radius: var(--r);
      background: rgba(192, 112, 104, 0.09);
      text-align: center;
      line-height: 1.55;
      animation: rise 0.4s var(--ease) both;
    }

    .renew-alert.on { display: flex; }

    .renew-dot,
    .stat-pulse {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
      background: var(--bad);
      box-shadow: 0 0 0 0 rgba(192, 112, 104, 0.55);
      animation: blink-dot 1.35s ease-out infinite;
    }

    .notice {
      display: none;
      align-items: center;
      justify-content: center;
      min-height: var(--h-ctl);
      padding: 10px 16px;
      margin-bottom: 16px;
      border: 1.5px solid rgba(240, 160, 64, 0.65);
      border-radius: var(--r);
      background: rgba(240, 160, 64, 0.07);
      text-align: center;
      animation: rise 0.4s var(--ease) both;
    }

    .notice.on { display: flex; }

    .notice #notice-t {
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      font-size: 0.84rem;
      font-weight: 700;
      color: #f0a040;
      line-height: 1.45;
      word-break: break-word;
      overflow-wrap: anywhere;
      text-align: center;
      white-space: normal;
    }

    .notice a { color: #ffb84d; font-weight: 700; text-decoration: none; }
    .notice a:hover { text-decoration: underline; }

    @keyframes blink-dot {
      0%, 100% { opacity: 1; box-shadow: 0 0 0 0 rgba(192, 112, 104, 0.5); }
      50% { opacity: 0.35; box-shadow: 0 0 0 6px rgba(192, 112, 104, 0); }
    }

    .stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 16px;
    }

    .stat { overflow: hidden; }

    .stat-title,
    .apps-title {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 11px 12px;
      font-size: 1rem;
      font-weight: 700;
      color: var(--accent);
      text-align: center;
      background: var(--surface);
      border: 1px solid var(--line);
      border-bottom: none;
      border-radius: var(--r) var(--r) 0 0;
    }

    .stat-title { transition: color 0.25s var(--ease); }

    .stat-pulse { display: none; }
    .stat-title.alert { color: var(--alert); }
    .stat-title.alert .stat-pulse { display: block; }

    .stat-body,
    .apps-body {
      padding: var(--os-pad);
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 0 0 var(--r) var(--r);
    }

    .stat-body {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .stat-rem,
    .stat-used,
    .stat-tot {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      height: var(--h-ctl);
      padding: 0 10px;
      border-radius: var(--r-sm);
      min-width: 0;
    }

    .stat-rem,
    .stat-used {
      background: var(--accent-dim);
      border: 1px solid var(--accent-soft);
    }

    .stat-tot {
      background: var(--bg-2);
      border: 1px solid var(--line);
    }

    .stat-sub {
      font-size: 0.7rem;
      color: var(--muted);
      flex-shrink: 0;
    }

    .stat-v {
      font-size: 1rem;
      font-weight: 700;
      max-width: 62%;
      text-align: end;
      color: var(--text);
    }

    .stat-v-sm {
      font-size: 0.84rem;
      font-weight: 600;
      color: var(--muted);
      max-width: 62%;
      text-align: end;
    }

    .bar-row {
      display: flex;
      align-items: center;
      gap: 8px;
      width: 100%;
      margin-top: 2px;
    }

    .bar {
      flex: 1 1 auto;
      min-width: 0;
      height: 9px;
      background: var(--bg-2);
      border-radius: 99px;
      overflow: hidden;
    }

    .bar i {
      display: block;
      height: 100%;
      width: 0;
      background: linear-gradient(90deg, var(--accent), #8ec0df);
      border-radius: 99px;
      transition: width 0.55s var(--ease);
    }

    .bar.warn i { background: linear-gradient(90deg, var(--warn), #e0c070); }
    .bar.bad i { background: linear-gradient(90deg, var(--bad), #d89088); }
    .bar.ok i { background: linear-gradient(90deg, var(--ok), #7ecf9a); }

    .bar-pct {
      flex-shrink: 0;
      min-width: 2.6em;
      font-size: 0.72rem;
      font-weight: 700;
      color: var(--accent);
      text-align: end;
    }

    .bar-row.warn .bar-pct { color: var(--warn); }
    .bar-row.bad .bar-pct { color: var(--bad); }
    .bar-row.ok .bar-pct { color: var(--ok); }

    .btns {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 16px;
    }

    .btn {
      display: inline-grid;
      grid-auto-flow: column;
      align-items: center;
      justify-content: center;
      column-gap: 8px;
      width: 100%;
      min-width: 0;
      height: var(--h-ctl);
      padding: 0 12px;
      border: 1px solid var(--accent);
      border-radius: var(--r);
      background: var(--accent);
      color: var(--bg);
      font: inherit;
      font-size: 0.95rem;
      font-weight: 400;
      line-height: 1;
      cursor: pointer;
      overflow: hidden;
      transition: filter 0.2s var(--ease), transform 0.2s var(--ease), box-shadow 0.2s var(--ease);
    }

    .btn > span {
      display: block;
      line-height: 1;
    }

    .btn:hover {
      filter: brightness(1.08);
      box-shadow: 0 6px 20px rgba(107, 163, 199, 0.18);
    }
    .btn:active { transform: scale(0.98); }

    .os-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: var(--os-gap);
    }

    .apps-panel { overflow: hidden; min-width: 0; }

    .apps-body .empty {
      padding: 16px 12px;
      border: none;
      background: transparent;
    }

    .os-tile {
      position: relative;
      width: 100%;
      min-width: 0;
      max-width: 100%;
      height: var(--h-ctl);
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--r);
      cursor: pointer;
      font: inherit;
      color: inherit;
      line-height: 1;
      appearance: none;
      -webkit-appearance: none;
      transition: border-color 0.22s var(--ease), background 0.22s var(--ease), transform 0.22s var(--ease);
      overflow: hidden;
      animation: rise 0.45s var(--ease) both;
    }

    .os-tile-in {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: row;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 0 10px;
      pointer-events: none;
      line-height: 0;
    }

    .os-tile:nth-child(1) { animation-delay: 0.04s; }
    .os-tile:nth-child(2) { animation-delay: 0.08s; }
    .os-tile:nth-child(3) { animation-delay: 0.12s; }
    .os-tile:nth-child(4) { animation-delay: 0.16s; }
    .os-tile:nth-child(n+5) { animation-delay: 0.2s; }

    .os-tile:hover {
      background: var(--surface-2);
      border-color: var(--accent-soft);
      transform: translateY(-1px);
    }

    .os-tile:active { transform: translateY(0) scale(0.98); }

    .os-tile.ios .os-logo { color: #e8e8ed; background: rgba(160, 160, 170, 0.1); border-color: rgba(160, 160, 170, 0.28); }
    .os-tile.android .os-logo,
    .os-tile.androidtv .os-logo { color: #3ddc84; background: rgba(61, 220, 132, 0.08); border-color: rgba(61, 220, 132, 0.28); }
    .os-tile.windows .os-logo { color: #50a8eb; background: rgba(0, 120, 212, 0.1); border-color: rgba(0, 120, 212, 0.28); }
    .os-tile.macos .os-logo { color: #c8c8cc; background: rgba(180, 180, 190, 0.1); border-color: rgba(180, 180, 190, 0.28); }
    .os-tile.linux .os-logo { color: #fcc624; background: rgba(252, 198, 36, 0.08); border-color: rgba(252, 198, 36, 0.28); }
    .os-tile.appletv .os-logo { color: #f5f5f7; background: rgba(200, 200, 210, 0.08); border-color: rgba(200, 200, 210, 0.25); }
    .os-tile.web .os-logo { color: #7eb8ff; background: rgba(66, 133, 244, 0.1); border-color: rgba(66, 133, 244, 0.28); }
    .os-tile.other .os-logo { color: var(--muted); background: rgba(138, 150, 168, 0.08); border-color: rgba(138, 150, 168, 0.25); }

    .os-tile.current {
      border-color: rgba(93, 171, 122, 0.7);
      background: rgba(93, 171, 122, 0.08);
    }

    .os-tile.current:hover {
      border-color: rgba(93, 171, 122, 0.9);
      background: rgba(93, 171, 122, 0.12);
    }

    .os-tag {
      display: inline-grid;
      grid-auto-flow: column;
      align-items: center;
      justify-content: center;
      column-gap: 6px;
      flex: 0 0 auto;
      height: 28px;
      max-width: 55%;
      padding: 0 10px 0 8px;
      border: 1.5px solid rgba(93, 171, 122, 0.65);
      border-radius: 999px;
      background: rgba(93, 171, 122, 0.1);
      color: var(--ok);
      font-size: 0.62rem;
      font-weight: 700;
      line-height: 1;
    }

    .os-live {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      flex-shrink: 0;
      background: var(--ok);
      box-shadow: 0 0 0 0 rgba(93, 171, 122, 0.55);
      animation: blink-ok 1.35s ease-out infinite;
    }

    @keyframes blink-ok {
      0%, 100% { opacity: 1; box-shadow: 0 0 0 0 rgba(93, 171, 122, 0.5); }
      50% { opacity: 0.35; box-shadow: 0 0 0 6px rgba(93, 171, 122, 0); }
    }

    .os-logo {
      display: grid;
      place-items: center;
      flex: 0 0 28px;
      width: 28px;
      height: 28px;
      border: 1px solid transparent;
      border-radius: var(--r-sm);
      line-height: 0;
      overflow: hidden;
    }

    .os-logo svg {
      width: 16px;
      height: 16px;
      display: block;
      margin: 0;
      overflow: visible;
      flex-shrink: 0;
    }

    .os-name {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      flex: 1 1 auto;
      min-width: 0;
      min-height: 28px;
      font-size: 0.86rem;
      font-weight: 700;
      line-height: 1;
      text-align: end;
    }

    .os-list { display: grid; gap: 12px; }

    .app-card {
      padding: 16px;
      min-width: 0;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--r);
      animation: rise 0.35s var(--ease) both;
      transition: border-color 0.2s var(--ease);
    }

    .app-card:hover { border-color: var(--accent-soft); }

    .app-head {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      margin-bottom: 14px;
    }

    .app-ico {
      width: var(--h-ico);
      height: var(--h-ico);
      min-width: var(--h-ico);
      border: 1px solid var(--line);
      border-radius: var(--r-sm);
      display: grid;
      place-items: center;
      flex-shrink: 0;
      background: var(--bg-2);
      line-height: 0;
      overflow: hidden;
    }

    .app-ico svg {
      width: 22px;
      height: 22px;
      display: block;
      margin: 0;
      flex-shrink: 0;
      overflow: visible;
    }

    .app-ico.ios { color: #e8e8ed; border-color: rgba(160, 160, 170, 0.35); }
    .app-ico.android, .app-ico.androidtv { color: #3ddc84; border-color: rgba(61, 220, 132, 0.35); }
    .app-ico.windows { color: #50a8eb; border-color: rgba(0, 120, 212, 0.35); }
    .app-ico.macos, .app-ico.appletv { color: #c8c8cc; border-color: rgba(180, 180, 190, 0.32); }
    .app-ico.linux { color: #fcc624; border-color: rgba(252, 198, 36, 0.32); }
    .app-ico.web { color: #7eb8ff; border-color: rgba(66, 133, 244, 0.32); }
    .app-ico.other { color: var(--muted); border-color: rgba(138, 150, 168, 0.28); }

    .app-info { flex: 1; min-width: 0; }

    .app-name-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
      min-width: 0;
    }

    .app-name {
      display: block;
      flex: 1 1 auto;
      min-width: 0;
      font-size: 0.92rem;

      }
    }

    function cleanToken(v) {

    function parseInput(raw) {
      raw = String(raw || "").trim();

      try {
        if (/^[a-z][a-z0-9+.-]*:/i.test(raw)) {
          var u = new URL(raw);
          for (var i = 0; i < TOKEN_KEYS.length; i++) {
            var q = u.searchParams.get(TOKEN_KEYS[i]);
            if (q) return { panel: u.searchParams.get("panel") || u.searchParams.get("panel_url") || u.origin, token: cleanToken(q) };
          }
          var path = u.pathname.replace(/\/+$/, "").replace(/\/(?:info|apps|links|raw|usage)$/i, "");
          var parts = path.split("/").filter(Boolean);
          var token = parts.length ? cleanToken(parts[parts.length - 1]) : "";
          if (token && !/\.(?:html?|php)$/i.test(token)) return { panel: u.origin, token: token, subPath: path };
        }
      } catch (e) {}
      if (raw.indexOf("/") > -1 && raw.indexOf("://") === -1) {
        var p = raw.split(/[?#]/)[0].replace(/\/+$/, "").replace(/\/(?:info|apps|links|raw|usage)$/i, "");
        var ps = p.split("/").filter(Boolean);
        if (ps.length) return { token: cleanToken(ps[ps.length - 1]), subPath: p.charAt(0) === "/" ? p : "/" + p };
      }
      if (!/\s/.test(raw) && raw.indexOf("/") === -1) return { token: cleanToken(raw) };
      return null;

      if (panel && !/^https?:\/\//i.test(panel)) panel = "https://" + panel;
      if (!panel) return null;
      var sp = p.subPath || "/sub/" + encodeURIComponent(p.token);
      if (sp.charAt(0) !== "/") sp = "/" + sp;
      sp = sp.replace(/\/+$/, "");
      return {

      var used = Number(g(u, ["used_traffic", "used", "consumed_traffic"]) || 0);

      var volInfinite = !(limit > 0);

      app.links.forEach(function (l) {
        var label = pickFa(l.name) || (typeof l.name === "string" ? l.name : "") || "دانلود";
        acts += '<a class="act-btn" href="' + esc(abs(l.url)) + '" target="_blank" rel="noopener" aria-label="' + esc(label) + '" title="' + esc(label) + '">' + ICO.dl + '<span>' + esc(label) + '</span></a>';
      });
      if (app.importUrl) {
        acts += '<a class="act-btn import" href="' + esc(abs(app.importUrl)) + '" target="_blank" rel="noopener" aria-label="' + esc(app.importLabel) + '" title="' + esc(app.importLabel) + '">' + ICO.add + '<span>' + esc(app.importLabel) + '</span></a>';
      }
      return '<article class="app-card' + (app.recommended ? ' rec' : '') + '">' +
        '<div class="app-head">' +
        '<span class="app-ico ' + esc(pk) + '">' + platIcon(pk) + '</span>' +
        '<div class="app-info">' +
        '<div class="app-name-row">' +
        '<span class="app-name">' + esc(app.name) + '</span>' +
        (app.recommended ? '<span class="app-tag rec">پیشنهادی</span>' : '') +
        '</div>' +
        (app.desc ? '<p class="app-desc">' + esc(app.desc) + '</p>' : '') +
        '</div></div>' +
        (acts ? '<div class="app-actions">' + acts + '</div>' : '') +
        '</article>';
    }

    function groupApps() {
      var groups = {};
      S.apps.forEach(function (app) {
        var k = app.platform || "other";
        if (!groups[k]) groups[k] = [];
        groups[k].push(app);
      });
      Object.keys(groups).forEach(function (k) {
        groups[k].sort(function (a, b) {
          if (!!a.recommended !== !!b.recommended) return a.recommended ? -1 : 1;
          return String(a.name).localeCompare(String(b.name), "fa");
        });
      });
      S.groups = groups;
      return groups;
    }

    var _icoApple = '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><g transform="translate(3 0) scale(0.046875)"><path d="M318.7 268.7c-.2-36.7 16.4-64.4 50-84.8-18.8-26.9-47.2-41.7-84.7-44.6-35.5-2.8-74.3 20.7-88.5 20.7-15 0-49.4-19.7-76.4-19.7C63.3 141.2 4 184.8 4 273.5q0 39.3 14.4 81.2c12.8 36.7 59 126.7 107.2 125.2 25.2-.6 43-17.9 75.8-17.9 31.8 0 48.3 17.9 76.4 17.9 48.6-.7 90.4-82.5 102.6-119.3-65.2-30.7-61.7-90-61.7-91.9zm-56.6-164.2c27.3-32.4 24.8-61.9 24-72.5-24.1 1.4-52 16.4-67.9 34.9-17.5 19.8-27.8 44.3-25.6 71.9 26.1 2 49.9-11.4 69.5-34.3z"/></g></svg>';
    var _icoTv = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="5" width="18" height="13" rx="2"/><path d="M8 21h8M12 18v3"/></svg>';
    var PLAT_ICON = {
      ios: _icoApple,
      macos: _icoApple,
      android: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M17.6 9.48l1.84-3.18c.16-.31.04-.69-.26-.85a.637.637 0 0 0-.83.22l-1.88 3.24a11.463 11.463 0 0 0-8.94 0L5.65 5.67a.643.643 0 0 0-.87-.2.641.641 0 0 0-.26.85l1.84 3.18C4.41 11.22 3 13.79 3 16.78h18c0-2.99-1.41-5.56-3.4-7.3zM8.5 15.5a1 1 0 1 1 0-2 1 1 0 0 1 0 2zm7 0a1 1 0 1 1 0-2 1 1 0 0 1 0 2z"/></svg>',
      androidtv: _icoTv,
      appletv: _icoTv,
      windows: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M4 5h7v6H4V5Zm9 0h7v6h-7V5ZM4 13h7v6H4v-6Zm9 0h7v6h-7v-6Z"/></svg>',
      linux: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 3C9.6 3 8 5.1 8 8.1c0 1.5-.5 2.8-1.3 4.1L5 15.4c-.7 1.4.2 2.6 1.6 2.6h10.8c1.4 0 2.3-1.2 1.6-2.6l-1.7-3.2C16.5 10.9 16 9.6 16 8.1 16 5.1 14.4 3 12 3zm-3 16.5L7.8 21M15 19.5l1.2 1.5M10 8h.01M14 8h.01"/></svg>',
      web: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.3 2.5 3.5 5.5 3.5 9S14.3 18.5 12 21M12 3C9.7 5.5 8.5 8.5 8.5 12S9.7 18.5 12 21"/></svg>',
      other: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="4" width="6" height="6" rx="1.5"/><rect x="14" y="4" width="6" height="6" rx="1.5"/><rect x="4" y="14" width="6" height="6" rx="1.5"/><rect x="14" y="14" width="6" height="6" rx="1.5"/></svg>'
    };

    function platIcon(k) { return PLAT_ICON[k] || PLAT_ICON.other; }

    function detectClientOs() {
      try {
        var ua = navigator.userAgent || "";
        var plat = navigator.platform || "";
        var ch = navigator.userAgentData;

        if (ch && ch.platform) {
          var cp = String(ch.platform).toLowerCase();
          if (cp === "android") return /tv|aft|googletv|bravia|smart-?tv/i.test(ua) ? "androidtv" : "android";
          if (cp === "ios") return "ios";
          if (cp === "windows") return "windows";
          if (cp === "macos") return navigator.maxTouchPoints > 1 ? "ios" : "macos";
          if (cp === "chrome os" || cp === "chromeos") return "web";
          if (cp === "linux") return "linux";
        }

        if (/AppleTV|Apple TV|TVOS/i.test(ua)) return "appletv";
        if (/iPhone|iPod/i.test(ua)) return "ios";
        if (/iPad/i.test(ua) || (plat === "MacIntel" && navigator.maxTouchPoints > 1)) return "ios";
        if (/Android/i.test(ua)) {
          if (/Android TV|SMART-?TV|GoogleTV|AFT|BRAVIA|\bTV\b/i.test(ua)) return "androidtv";
          return "android";
        }
        if (/Win/i.test(plat) || /Windows/i.test(ua)) return "windows";
        if (/Mac/i.test(plat) || /Macintosh/i.test(ua)) return "macos";
        if (/CrOS/i.test(ua)) return "web";
        if (/Linux/i.test(plat) || /Linux/i.test(ua)) return "linux";
      } catch (e) {}
      return "";
    }

    function openOsModal(k) {
      var list = S.groups[k] || [];
      $("m-apps-t").innerHTML = platIcon(k) + "<span>" + esc(PLAT[k] || k) + "</span>";
      $("m-apps-list").innerHTML = list.length ? list.map(appCardHtml).join("") : '<div class="empty">اپلیکیشنی نیست</div>';
      open("m-apps");
    }

    var APPS_TITLE_ICO = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>';

    function paintApps() {
      var shell = function (inner) {
        return '<div class="apps-panel"><div class="apps-title">' + APPS_TITLE_ICO + 'اپلیکیشن‌ها</div><div class="apps-body">' + inner + '</div></div>';
      };
      if (!S.apps.length) {
        $("apps").innerHTML = shell('<div class="empty">اپلیکیشنی نیست</div>');
        return;
      }
      var groups = groupApps();
      var keys = PLAT_ORDER.filter(function (k) { return groups[k] && groups[k].length; });
      Object.keys(groups).forEach(function (k) {
        if (keys.indexOf(k) < 0) keys.push(k);
      });

      var current = detectClientOs();
      if (current && keys.indexOf(current) >= 0) {
        keys = [current].concat(keys.filter(function (k) { return k !== current; }));
      }

      $("apps").innerHTML = shell(
        '<div class="os-grid">' + keys.map(function (k) {
          var mine = k === current;
          return '<button type="button" class="os-tile ' + esc(k) + (mine ? " current" : "") + '" data-os="' + esc(k) + '">' +
            '<span class="os-tile-in">' +
            (mine
              ? '<span class="os-tag"><span class="os-live" aria-hidden="true"></span>دستگاه شما</span>'
              : '<span class="os-logo">' + platIcon(k) + '</span>') +
            '<span class="os-name">' + esc(PLAT[k] || k) + '</span>' +
            '</span></button>';
        }).join("") + '</div>'
      );
    }

    function qrLib() {
      if (window.QRCode) return Promise.resolve();
      if (S.qr) return S.qr;
      S.qr = new Promise(function (ok, fail) {
        var s = document.createElement("script");
        s.src = "https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js";
        s.async = true;
        s.onload = ok;
        s.onerror = fail;
        document.head.appendChild(s);
      });
      return S.qr;
    }

    function showQr(text) {
      var el = $("qr");
      el.textContent = "…";
      qrLib().then(function () {
        el.innerHTML = "";
        try {
          new QRCode(el, {
            text: text,
            width: 200,
            height: 200,
            colorDark: "#e8eef4",
            colorLight: "rgba(0,0,0,0)",
            correctLevel: QRCode.CorrectLevel.M
          });
          var c = el.querySelector("canvas");
          if (c) { c.style.display = "block"; c.style.width = "100%"; c.style.height = "auto"; c.style.aspectRatio = "1"; }
        } catch (e) { el.textContent = "QR در دسترس نیست"; }
      }).catch(function () { el.textContent = "خطا"; });
    }

    function openSub(title, payload) {
      $("m-sub-label").textContent = title || "لینک اشتراک";
      $("sub-link").value = payload;
      var cpBtn = $("copy-sub");
      cpBtn.innerHTML = ICO.copy;
      cpBtn.classList.remove("copied");
      cpBtn.disabled = false;
      showQr(payload);
      open("m-sub");
    }

    function wgParam(p, n) {
      var d = p.get(n);
      if (d) return d;
      var target = n.toLowerCase(), found = "";
      p.forEach(function (v, k) { if (!found && k.toLowerCase() === target) found = v; });
      return found;
    }

    function wgText(raw) {
      raw = String(raw || "").trim();
      if (/^\[Interface\]/i.test(raw)) return raw + (raw.slice(-1) === "\n" ? "" : "\n");
      if (!/^wireguard:\/\//i.test(raw)) return null;
      try {
        var u = new URL(raw), p = u.searchParams;
        var pk = safe(u.username || wgParam(p, "privatekey"));
        var pub = wgParam(p, "publickey"), addr = wgParam(p, "address"), ep = wgParam(p, "endpoint");
        if (!pk || !pub || !addr) return null;
        var host = u.hostname;
        if (host.indexOf(":") >= 0 && host[0] !== "[") host = "[" + host + "]";
        if (!ep) ep = u.port ? host + ":" + u.port : host;
        return ["[Interface]", "PrivateKey = " + pk, "Address = " + addr, "", "[Peer]", "PublicKey = " + pub,
          "AllowedIPs = 0.0.0.0/0, ::/0", "Endpoint = " + ep, "PersistentKeepalive = 25"].join("\n") + "\n";
      } catch (e) { return null; }
    }

    function fileName(preferred) {
      var u = S.user || {};
      var user = String(g(u, ["username", "name"]) || "").trim();
      var clean = function (s) {
        return String(s || "")
          .replace(/[<>:"/\\|?*\u0000-\u001f]/g, "")
          .replace(/[\s\u200c\u200e\u200f\u202a-\u202e]+/g, "-")
          .replace(/-+/g, "-")
          .replace(/^[-.]+|[-.]+$/g, "");
      };
      return clean(preferred) || clean(user) || "wireguard";
    }

    function dl(text, name) {
      var b = new Blob([text], { type: "text/plain" });
      var u = URL.createObjectURL(b);
      var a = document.createElement("a");
      a.href = u;
      a.download = fileName(name) + ".conf";
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(u);
    }

    function boot(c) {
      S.ctx = c;
      S.user = null;
      S.hdr = {};
      S.links = [];
      S.apps = [];
      localStorage.setItem(LS.panel, c.panel);
      localStorage.setItem(LS.token, c.subUrl);
      load(true);
      fetchLinks().then(function (l) {
        S.links = l;
      });
      fetchApps().then(function (a) { S.apps = a; paintApps(); });
      getInfo().then(function (r) { S.user = r.user; S.hdr = r.hdr; paint(); })
        .catch(function () {})
        .finally(function () { load(false); });
    }

    $("btn-sub").onclick = function () { if (S.ctx) openSub("لینک اشتراک", S.ctx.subUrl); };
    $("btn-cfg").onclick = function () { paintCfgs(); open("m-cfg"); };
    $("copy-sub").onclick = function () { if ($("sub-link").value) copy($("sub-link").value, $("copy-sub")); };

    $("apps").addEventListener("click", function (e) {
      var btn = e.target.closest("[data-os]");
      if (btn) openOsModal(btn.getAttribute("data-os"));
    });

    $("cfg-list").onclick = function (e) {
      var b = e.target.closest("[data-a]");
      if (!b) return;
      var it = S.items[Number(b.closest("[data-i]").getAttribute("data-i"))];
      if (!it) return;
      var a = b.getAttribute("data-a");
      if (a === "cp") copy(it.payload, b);
      else if (a === "qr") { close("m-cfg"); openSub(it.title, it.payload); }
      else if (a === "dl") { var w = wgText(it.payload); if (w) dl(w, it.title); }
    };

    document.querySelectorAll("[data-close]").forEach(function (b) {
      b.onclick = function () { close(b.getAttribute("data-close")); };
    });
    document.querySelectorAll(".overlay").forEach(function (v) {
      v.onclick = function (e) { if (e.target === v) close(v.id); };
    });
    document.onkeydown = function (e) {
      if (e.key === "Escape") { close("m-sub"); close("m-cfg"); close("m-apps"); }
    };

    var auto = detect();
    if (auto) boot(auto);
    else {
      var c = makeCtx(CFG.panelUrl || CFG.panel || "", CFG.subscriptionUrl || CFG.token || CFG.sub || "");
      if (c) boot(c);
      else {
        var p = localStorage.getItem(LS.panel), t = localStorage.getItem(LS.token);
        if (p && t) { c = makeCtx(p, t); if (c) boot(c); }
      }
    }
  })();
  </script>
</body>
